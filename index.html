
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Stream Queue 管理画面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <header>
    <h1>STREAM QUEUE</h1>
    <span id="connection">未接続</span>
  </header>

  <section id="loginPanel" class="panel">
    <h2>管理者ログイン</h2>
    <form id="loginForm">
      <label>
        メールアドレス
        <input id="email" type="email" autocomplete="username" required>
      </label>
      <label>
        パスワード
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">ログイン</button>
    </form>
  </section>

  <section id="adminPanel" hidden>
    <div class="toolbar">
      <h2>配信管理パネル</h2>
      <button id="logout" class="secondary">ログアウト</button>
    </div>

    <section class="panel">
      <div class="toolbar">
        <h3>参加受付</h3>
        <strong id="statusLabel"></strong>
      </div>
      <label class="check">
        <input id="accepting" type="checkbox">
        参加を受け付ける
      </label>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h3>参加者管理</h3>
        <span id="count"></span>
      </div>

      <form id="addForm" class="inline">
        <input
          id="participantName"
          maxlength="60"
          placeholder="参加者名"
          required
        >
        <button type="submit">追加</button>
      </form>
    </section>

    <section class="panel now-panel">
      <div class="toolbar">
        <h3>NOW PLAYER</h3>
        <span id="nowCount">0人</span>
      </div>

      <p class="section-description">
        現在プレイ中の参加者
      </p>

      <div id="nowQueue"></div>
      <p id="nowEmpty" class="queue-empty">
        現在プレイ中の参加者はいません
      </p>
    </section>

    <section class="panel">
      <div class="toolbar">
        <h3>WAITING LIST</h3>
        <span id="waitingCount">0人</span>
      </div>

      <p class="section-description">
        待機中の参加者。「NOWへ」でプレイ中に変更できます。
      </p>

      <div id="queue"></div>

      <p id="waitingEmpty" class="queue-empty">
        現在、待機者はいません
      </p>

      <button id="complete" class="secondary">
        先頭の待機者を完了
      </button>
    </section>

    <section class="panel">
      <h3>オーバーレイ設定</h3>

      <div class="fields">
        <label>
          メインカラー
          <input id="theme" type="color">
        </label>
        <label>
          HEXカラー
          <input id="themeHex" maxlength="7" placeholder="#8b5cf6">
        </label>
        <label>
          表示タイトル
          <input id="title" maxlength="80">
        </label>
        <label>
          案内文
          <input id="message" maxlength="160">
        </label>
        <label>
          YouTube Live URL
          <input
            id="youtubeUrl"
            type="url"
            placeholder="https://www.youtube.com/watch?v=..."
          >
        </label>
        <label>
          Twitchチャンネル名
          <input id="twitchChannel" maxlength="50">
        </label>
      </div>

      <button id="saveSettings" type="button">
        設定を保存
      </button>
    </section>
  </section>

  <p id="notice" role="status" aria-live="polite"></p>
</main>

<script type="module" src="admin.js"></script>
</body>
</html>
